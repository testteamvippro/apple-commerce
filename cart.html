<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng — Apple Store VN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="nav-logo">
            <img src="assets/images/logo.svg" height="36" alt="TÁO HOUSE">
        </a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Sản Phẩm</a>
            <a href="orders.html" class="nav-link">Đơn Hàng</a>
        </div>
        <a href="cart.html" class="nav-cart">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
            <span class="cart-badge" id="cartBadge">0</span>
        </a>
        <button class="nav-burger" id="navBurger"><span></span><span></span><span></span></button>
    </div>
    <div class="nav-mobile" id="navMobile">
        <a href="index.html">Sản Phẩm</a>
        <a href="orders.html">Đơn Hàng</a>
        <a href="cart.html">Giỏ Hàng</a>
    </div>
</nav>

<div class="page-hero">
    <div class="container">
        <h1>Giỏ Hàng</h1>
        <p>Kiểm tra lại sản phẩm trước thanh toán</p>

<div class="container">
    <div class="cart-layout">
        <!-- Items -->
        <div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-empty-state" id="cartEmpty" style="display:none">
                <div class="empty-icon">🛒</div>
                <h3>Giỏ hàng trống</h3>
                <p>Bạn chưa thêm sản phẩm nào.</p>
                <a href="index.html" class="btn-primary">Bắt Đầu Mua Sắm</a>
            </div>
        </div>

        <!-- Summary -->
        <div class="cart-summary-card" id="cartSummary">
            <h3>Tóm Tắt Đơn Hàng</h3>
            <div class="summary-line"><span>Tạm Tính</span><span id="subtotal">0₫</span></div>
            <div class="summary-line"><span>Thuế (10%)</span><span id="tax">0₫</span></div>
            <div class="summary-line total"><span>Tổng</span><span id="total">0₫</span></div>
            <button class="btn-checkout" onclick="goToCheckout()">Tiếp Tục Thanh Toán →</button>
            <a href="index.html" class="btn-continue">← Tiếp Tục Mua Sắm</a>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="container">
        <div class="footer-bottom"><p>© 2026 Apple Store VN. Mọi quyền bảo lưu.</p></div>
    </div>
</footer>

<script src="assets/js/api.js"></script>
<script src="assets/js/cart.js"></script>
<script>
document.getElementById('navBurger').addEventListener('click', () => {
    document.getElementById('navMobile').classList.toggle('open');
});
</script>
</body>
</html>
