<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Apple Store</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <h1>🍎 Apple Store</h1>
            </div>
            <div class="navbar-menu">
                <a href="index.html" class="nav-link">Products</a>
                <a href="cart.html" class="nav-link active">🛒 Cart</a>
            </div>
        </div>
    </nav>

    <!-- Cart Section -->
    <section class="cart-section">
        <div class="container">
            <h2>Shopping Cart</h2>
            
            <div class="cart-content">
                <!-- Cart Items -->
                <div class="cart-items" id="cartItems">
                    <!-- Cart items loaded by JavaScript -->
                </div>

                <!-- Cart Empty State -->
                <div class="cart-empty" id="cartEmpty" style="display: none;">
                    <p>Your cart is empty</p>
                    <a href="index.html" class="btn-primary">Continue Shopping</a>
                </div>

                <!-- Cart Summary -->
                <div class="cart-summary" id="cartSummary">
                    <h3>Order Summary</h3>
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax (10%):</span>
                        <span id="tax">$0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="total">$0.00</span>
                    </div>
                    <button class="btn-checkout" onclick="goToCheckout()">Proceed to Checkout</button>
                    <a href="index.html" class="btn-secondary">Continue Shopping</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Apple Store. Easy deployment on Hostinger/Inet. All rights reserved.</p>
        </div>
    </footer>

    <script src="assets/js/cart.js"></script>
</body>
</html>
