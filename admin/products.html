<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management - Apple Store Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin-panel.css">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <h2>🍎 Admin</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="products.html" class="active">📱 Products</a>
        <a href="orders.html">📦 Orders</a>
        <a href="analytics.html">📈 Analytics</a>
        <a href="settings.html">⚙️ Settings</a>
        <button id="logout-btn">🚪 Logout</button>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <header class="admin-header">
        <h1>📱 Product Management</h1>
        <div class="header-controls">
          <div class="search-box">
            <input type="text" id="product-search" placeholder="Search products...">
          </div>
          <button id="add-product-btn" class="btn-primary">+ Add Product</button>
        </div>
      </header>

      <!-- Products Table -->
      <section class="dashboard-section">
        <table class="admin-table">
          <thead>
            <tr>
              <th style="width: 30px;">
                <input type="checkbox" id="select-all">
              </th>
              <th>Product Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="products-table-body">
            <tr>
              <td colspan="7" style="text-align: center; padding: 2rem;">Loading...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- Product Modal -->
  <div id="product-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">×</button>
      <h2 id="modal-title">Add Product</h2>

      <form id="product-form" class="product-form">
        <input type="hidden" id="product-id">

        <div class="form-group">
          <label for="product-name">Product Name</label>
          <input type="text" id="product-name" required>
        </div>

        <div class="form-group">
          <label for="product-category">Category</label>
          <select id="product-category" required>
            <option value="">Select Category</option>
            <option value="iphone">iPhone</option>
            <option value="ipad">iPad</option>
            <option value="macbook">MacBook</option>
            <option value="airpods">AirPods</option>
            <option value="accessories">Accessories</option>
          </select>
        </div>

        <div class="form-group">
          <label for="product-description">Description</label>
          <textarea id="product-description"></textarea>
        </div>

        <div class="form-group">
          <label for="product-price">Price (₫)</label>
          <input type="number" id="product-price" min="0" step="1000" required>
        </div>

        <div class="form-group">
          <label for="product-stock">Stock Quantity</label>
          <input type="number" id="product-stock" min="0" required>
        </div>

        <button type="submit" class="btn-primary btn-full">Save Product</button>
      </form>
    </div>
  </div>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/product-manager.js"></script>
</body>
</html>
