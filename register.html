<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản — Apple Store VN</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/enhancements.css">
  <link rel="stylesheet" href="assets/css/user-system.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="logo"><img src="assets/images/logo.svg" height="36" alt="TÁO HOUSE"></a>
      <div class="nav-links">
        <a href="/">Trang Chủ</a>
        <a href="login.html" class="btn-secondary">Đăng Nhập</a>
      </div>
    </div>
  </nav>

  <main class="auth-container">
    <div class="auth-card">
      <h1>Tạo Tài Khoản Mới</h1>
      <p class="auth-subtitle">Đăng ký để bắt đầu mua sắm</p>

      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="name">Họ và Tên</label>
          <input type="text" id="name" name="name" placeholder="Nguyễn Văn An" required>
        </div>

        <div class="form-group">
          <label for="email">Địa Chỉ Email</label>
          <input type="email" id="email" name="email" placeholder="email@example.com" required>
          <small class="password-hint">Dùng để đăng nhập tài khoản</small>
        </div>

        <div class="form-group">
          <label for="phone">Số Điện Thoại</label>
          <input type="tel" id="phone" name="phone" placeholder="0912345678" required>
        </div>

        <div class="form-group">
          <label for="password">Mật Khẩu</label>
          <input type="password" id="password" name="password" required>
          <small class="password-hint">
            Ít nhất 8 ký tự, gồm chữ hoa, chữ thường và số
          </small>
          <div class="password-requirements">
            <div class="requirement" id="req-length">
              <span class="req-icon">✓</span> Ít nhất 8 ký tự
            </div>
            <div class="requirement" id="req-upper">
              <span class="req-icon">✓</span> Chữ hoa (A-Z)
            </div>
            <div class="requirement" id="req-lower">
              <span class="req-icon">✓</span> Chữ thường (a-z)
            </div>
            <div class="requirement" id="req-number">
              <span class="req-icon">✓</span> Chữ số (0-9)
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password">Xác Nhận Mật Khẩu</label>
          <input type="password" id="confirm-password" name="confirm-password" required>
        </div>

        <label class="checkbox-label">
          <input type="checkbox" id="terms" name="terms" required>
          Tôi đồng ý với <a href="#">Điều Khoản Dịch Vụ</a> và <a href="#">Chính Sách Bảo Mật</a>
        </label>

        <button type="submit" class="btn-primary btn-full">Tạo Tài Khoản</button>
      </form>

      <div class="auth-divider">HOẶC</div>

      <div class="social-login">
        <button class="social-btn google-btn">
          <span>🔗</span> Đăng ký với Google
        </button>
        <button class="social-btn facebook-btn">
          <span>👥</span> Đăng ký với Facebook
        </button>
      </div>

      <p class="auth-footer">
        Đã có tài khoản? <a href="login.html">Đăng nhập</a>
      </p>
    </div>
  </main>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    const passwordInput = document.getElementById('password');

    passwordInput.addEventListener('input', () => {
      const password = passwordInput.value;

      // Check requirements
      document.getElementById('req-length').classList.toggle('met', password.length >= 8);
      document.getElementById('req-upper').classList.toggle('met', /[A-Z]/.test(password));
      document.getElementById('req-lower').classList.toggle('met', /[a-z]/.test(password));
      document.getElementById('req-number').classList.toggle('met', /\d/.test(password));
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const terms = document.getElementById('terms').checked;

      if (password !== confirmPassword) {
        showToast('Mật khẩu xác nhận không khớp', 'error');
        return;
      }

      if (!terms) {
        showToast('Vui lòng đồng ý với điều khoản dịch vụ', 'error');
        return;
      }

      try {
        setLoading(true, 'Đang tạo tài khoản...');
        const user = await auth.register(name, email, phone, password);
        
        showToast('Tạo tài khoản thành công!', 'success');
        setTimeout(() => {
          window.location.href = '/';
        }, 1000);
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
