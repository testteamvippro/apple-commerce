<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Apple Store VN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        :root {
            --admin-bg: #0f172a;
            --admin-card: #1e293b;
            --admin-border: #334155;
            --admin-text: #f1f5f9;
            --admin-text-muted: #cbd5e1;
            --success-bg: #064e3b;
            --warning-bg: #7c2d12;
        }

        body {
            background: var(--admin-bg);
            color: var(--admin-text);
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--admin-border);
        }

        .admin-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }

        .admin-header-actions {
            display: flex;
            gap: 10px;
        }

        .admin-header-actions button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all .2s;
            font-size: 14px;
        }

        .btn-admin-primary {
            background: var(--primary);
            color: white;
        }

        .btn-admin-primary:hover {
            background: #2563eb;
        }

        .btn-admin-danger {
            background: #dc2626;
            color: white;
        }

        .btn-admin-danger:hover {
            background: #b91c1c;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--admin-card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--admin-border);
        }

        .stat-card h3 {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--admin-text-muted);
            margin: 0 0 10px 0;
            letter-spacing: 0.5px;
        }

        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }

        .stat-card .stat-change {
            font-size: 12px;
            color: #4ade80;
            margin-top: 8px;
        }

        .admin-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .admin-card {
            background: var(--admin-card);
            border: 1px solid var(--admin-border);
            border-radius: 12px;
            padding: 20px;
        }

        .admin-card h2 {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 15px 0;
        }

        .filters-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--admin-border);
            color: var(--admin-text-muted);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all .2s;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .filter-btn:hover {
            border-color: var(--primary);
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .orders-table thead {
            border-bottom: 2px solid var(--admin-border);
        }

        .orders-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: var(--admin-text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .orders-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        .orders-table tbody tr:hover {
            background: rgba(59, 130, 246, 0.05);
        }

        .order-id {
            font-weight: 600;
            color: var(--primary);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: var(--warning-bg);
            color: #fbbf24;
        }

        .status-completed {
            background: var(--success-bg);
            color: #34d399;
        }

        .order-amount {
            color: #4ade80;
            font-weight: 600;
        }

        .order-actions {
            display: flex;
            gap: 6px;
        }

        .order-actions button {
            padding: 4px 8px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all .2s;
        }

        .btn-view {
            background: var(--primary);
            color: white;
        }

        .btn-view:hover {
            background: #2563eb;
        }

        .btn-delete {
            background: #dc2626;
            color: white;
        }

        .btn-delete:hover {
            background: #b91c1c;
        }

        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-content {
            background: var(--admin-card);
            border: 1px solid var(--admin-border);
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 0;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--admin-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--admin-text-muted);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            color: var(--admin-text);
        }

        .modal-body {
            padding: 20px;
        }

        .order-detail-section {
            margin-bottom: 20px;
        }

        .order-detail-section h4 {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--admin-text-muted);
            margin: 0 0 10px 0;
            letter-spacing: 0.5px;
        }

        .order-detail-content {
            font-size: 14px;
            line-height: 1.6;
        }

        .order-items {
            border: 1px solid var(--admin-border);
            border-radius: 6px;
            overflow: hidden;
        }

        .order-item {
            padding: 10px;
            border-bottom: 1px solid var(--admin-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--admin-text-muted);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .notification-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .notification-box.show {
            display: block;
            animation: slideIn .3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .notification-content {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .notification-icon {
            font-size: 18px;
        }

        .notification-text {
            flex: 1;
        }

        .notification-text strong {
            color: #10b981;
        }

        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .admin-header-actions {
                width: 100%;
            }

            .admin-header-actions button {
                flex: 1;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .orders-table {
                font-size: 12px;
            }

            .orders-table th,
            .orders-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
<div class="admin-container">
    <!-- Header -->
    <div class="admin-header">
        <div>
            <h1>📊 Admin Dashboard</h1>
            <p style="margin: 5px 0 0 0; color: var(--admin-text-muted); font-size: 14px;">Quản lý đơn hàng và khách hàng</p>
        </div>
        <div class="admin-header-actions">
            <button class="btn-admin-primary" onclick="exportAllOrdersAdmin()">📥 Xuất Dữ Liệu</button>
            <button class="btn-admin-danger" onclick="clearAllOrdersAdmin()">🗑️ Xóa Tất Cả</button>
            <button class="btn-admin-primary" onclick="goBackToStore()">← Quay Lại Store</button>
        </div>
    </div>

    <!-- Notification -->
    <div id="adminNotification" class="notification-box">
        <div class="notification-content">
            <div class="notification-icon">✅</div>
            <div class="notification-text">
                <strong id="notificationText"></strong>
            </div>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3>Tổng Đơn Hàng</h3>
            <p class="stat-value" id="totalOrders">0</p>
            <span class="stat-change" id="newOrdersToday">0 mới hôm nay</span>
        </div>
        <div class="stat-card">
            <h3>Tổng Doanh Thu</h3>
            <p class="stat-value" id="totalRevenue">0₫</p>
            <span class="stat-change" id="revenueToday">+0₫ hôm nay</span>
        </div>
        <div class="stat-card">
            <h3>Đơn Hàng Pending</h3>
            <p class="stat-value" id="pendingOrders">0</p>
            <span class="stat-change" id="pendingText">Chờ xác nhận</span>
        </div>
        <div class="stat-card">
            <h3>Khách Hàng Độc Nhất</h3>
            <p class="stat-value" id="uniqueCustomers">0</p>
            <span class="stat-change" id="customerChange">từ lần quay trở lại</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="admin-content">
        <div class="admin-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2>📋 Danh Sách Đơn Hàng</h2>
                <div>
                    <input type="text" id="searchInput" placeholder="Tìm kiếm..." 
                        style="padding: 6px 12px; border-radius: 6px; border: 1px solid var(--admin-border); 
                               background: transparent; color: var(--admin-text); width: 200px;">
                </div>
            </div>

            <div class="filters-bar">
                <button class="filter-btn active" onclick="filterOrders('all')">Tất Cả</button>
                <button class="filter-btn" onclick="filterOrders('today')">Hôm Nay</button>
                <button class="filter-btn" onclick="filterOrders('week')">Tuần Này</button>
                <button class="filter-btn" onclick="filterOrders('month')">Tháng Này</button>
            </div>

            <div id="ordersContainer"></div>
        </div>
    </div>
</div>

<!-- Order Detail Modal -->
<div id="orderModal" class="modal-backdrop">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Chi Tiết Đơn Hàng</h3>
            <button class="modal-close" onclick="closeOrderModal()">×</button>
        </div>
        <div class="modal-body" id="orderModalBody"></div>
    </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
