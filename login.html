<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Apple Store</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/enhancements.css">
  <link rel="stylesheet" href="assets/css/user-system.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="logo">🍎 Apple Store</a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="register.html" class="btn-secondary">Create Account</a>
      </div>
    </div>
  </nav>

  <main class="auth-container">
    <div class="auth-card">
      <h1>Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your account</p>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me" name="remember-me">
            Remember me
          </label>
          <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary btn-full">Sign In</button>
      </form>

      <div class="auth-divider">OR</div>

      <div class="social-login">
        <button class="social-btn google-btn">
          <span>🔗</span> Sign in with Google
        </button>
        <button class="social-btn facebook-btn">
          <span>👥</span> Sign in with Facebook
        </button>
      </div>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </div>
  </main>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    // Load remembered email
    const rememberEmail = localStorage.getItem('remember-email');
    if (rememberEmail) {
      document.getElementById('email').value = rememberEmail;
      document.getElementById('remember-me').checked = true;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('remember-me').checked;

      try {
        setLoading(true, 'Signing in...');
        const user = await auth.login(email, password, rememberMe);
        
        showToast('Login successful!', 'success');
        setTimeout(() => {
          window.location.href = '/';
        }, 1000);
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
