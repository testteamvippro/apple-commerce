<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ Sơ Của Tôi — Apple Store VN</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/enhancements.css">
  <link rel="stylesheet" href="assets/css/user-system.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="logo">🍎 Apple Store VN</a>
      <div class="nav-links">
        <a href="/">Trang Chủ</a>
        <span data-auth="user-name"></span>
        <button id="logout-btn" class="btn-secondary">Đăng Xuất</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="profile-page">
      <aside class="profile-sidebar">
        <div class="profile-card">
          <div class="profile-avatar">👤</div>
          <h2 id="profile-name">Tên Người Dùng</h2>
          <p id="profile-email">user@example.com</p>
        </div>

        <nav class="profile-nav">
          <a class="nav-item" href="pages/my-orders.html">
            📦 Đơn Hàng Của Tôi
          </a>
          <a class="nav-item" href="pages/notifications.html">
            🔔 Thông Báo
          </a>
          <button class="nav-item active" onclick="switchTab('personal')">
            👤 Thông Tin Cá Nhân
          </button>
          <button class="nav-item" onclick="switchTab('addresses')">
            📍 Địa Chỉ
          </button>
          <button class="nav-item" onclick="switchTab('security')">
            🔒 Bảo Mật
          </button>
          <button class="nav-item" onclick="switchTab('preferences')">
            ⚙️ Tùy Chọn
          </button>
        </nav>
      </aside>

      <section class="profile-content">
        <!-- Personal Info Tab -->
        <div id="tab-personal" class="profile-tab active">
          <h2>Thông Tin Cá Nhân</h2>
          <form id="personal-form" class="profile-form">
            <div class="form-group">
              <label>Họ và Tên</label>
              <input type="text" id="input-name" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="input-email" required>
              </div>
              <div class="form-group">
                <label>Số Điện Thoại</label>
                <input type="tel" id="input-phone" required>
              </div>
            </div>

            <div class="form-group">
              <label>Ngày Sinh</label>
              <input type="date" id="input-birthdate">
            </div>

            <button type="submit" class="btn-primary">Lưu Thay Đổi</button>
          </form>
        </div>

        <!-- Addresses Tab -->
        <div id="tab-addresses" class="profile-tab">
          <h2>Địa Chỉ Đã Lưu</h2>
          
          <div id="addresses-list" class="addresses-list"></div>

          <button class="btn-primary" onclick="openAddressModal()">+ Thêm Địa Chỉ Mới</button>
        </div>

        <!-- Security Tab -->
        <div id="tab-security" class="profile-tab">
          <h2>Cài Đặt Bảo Mật</h2>

          <div class="security-section">
            <h3>Đổi Mật Khẩu</h3>
            <form id="password-form" class="profile-form">
              <div class="form-group">
                <label>Mật Khẩu Hiện Tại</label>
                <input type="password" id="current-password" required>
              </div>

              <div class="form-group">
                <label>Mật Khẩu Mới</label>
                <input type="password" id="new-password" required>
              </div>

              <div class="form-group">
                <label>Xác Nhận Mật Khẩu Mới</label>
                <input type="password" id="confirm-new-password" required>
              </div>

              <button type="submit" class="btn-primary">Cập Nhật Mật Khẩu</button>
            </form>
          </div>

          <div class="security-section danger-zone">
            <h3>Khu Vực Nguy Hiểm</h3>
            <p>Xóa tài khoản là vĩnh viễn và không thể phục hồi.</p>
            <button onclick="showDeleteConfirm()" class="btn-danger">Xóa Tài Khoản</button>
          </div>
        </div>

        <!-- Preferences Tab -->
        <div id="tab-preferences" class="profile-tab">
          <h2>Tùy Chọn Tài Khoản</h2>
          
          <div class="preferences-section">
            <label class="checkbox-label">
              <input type="checkbox" checked>
              Thông báo email cho đơn hàng
            </label>
            <label class="checkbox-label">
              <input type="checkbox" checked>
              Email khuyến mãi và tiếp thị
            </label>
            <label class="checkbox-label">
              <input type="checkbox" checked>
              Gợi ý sản phẩm
            </label>
          </div>

          <button class="btn-primary">Lưu Tùy Chọn</button>
        </div>
      </section>
    </div>
  </main>

  <!-- Address Modal -->
  <div id="address-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <button class="modal-close" onclick="closeAddressModal()">×</button>
      <h2>Thêm Địa Chỉ</h2>
      
      <form id="address-form" class="profile-form">
        <div class="form-group">
          <label>Số Nhà, Tên Đường</label>
          <input type="text" id="address-street" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Thành Phố</label>
            <input type="text" id="address-city" required>
            </div>
            <div class="form-group">
            <label>Mã Bưu Điện</label>
            <input type="text" id="address-zip" required>
          </div>
        </div>

        <div class="form-group">
          <label>Đất Nước</label>
          <input type="text" id="address-country" required>
        </div>

        <label class="checkbox-label">
          <input type="checkbox" id="address-default">
          Đặt làm địa chỉ mặc định
        </label>

        <button type="submit" class="btn-primary btn-full">Lưu Địa Chỉ</button>
      </form>
    </div>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/user-profile.js"></script>
  <script>
    // Check authentication
    if (!auth.isLoggedIn()) {
      window.location.href = '/login.html';
    }

    // Load profile data
    function loadProfileData() {
      const user = auth.getUser();
      document.getElementById('profile-name').textContent = user.name;
      document.getElementById('profile-email').textContent = user.email;

      document.getElementById('input-name').value = user.name;
      document.getElementById('input-email').value = user.email;
      document.getElementById('input-phone').value = user.phone || '';
      document.getElementById('input-birthdate').value = user.birthDate || '';

      loadAddresses();
    }

    function switchTab(tab) {
      // Hide all tabs
      document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.profile-nav .nav-item').forEach(b => b.classList.remove('active'));

      // Show selected tab
      document.getElementById('tab-' + tab).classList.add('active');
      event.target.classList.add('active');
    }

    // Personal form
    document.getElementById('personal-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      try {
        setLoading(true, 'Đang cập nhật hồ sơ...');
        await userProfile.updateProfile(
          document.getElementById('input-name').value,
          document.getElementById('input-email').value,
          document.getElementById('input-phone').value,
          document.getElementById('input-birthdate').value
        );
        showToast('Cập nhật hồ sơ thành công', 'success');
        loadProfileData();
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        setLoading(false);
      }
    });

    // Password form
    document.getElementById('password-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      try {
        setLoading(true, 'Đang đổi mật khẩu...');
        await userProfile.changePassword(
          document.getElementById('current-password').value,
          document.getElementById('new-password').value,
          document.getElementById('confirm-new-password').value
        );
        showToast('Đổi mật khẩu thành công', 'success');
        document.getElementById('password-form').reset();
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        setLoading(false);
      }
    });

    // Address functions
    function loadAddresses() {
      const addresses = userProfile.getAddresses();
      const container = document.getElementById('addresses-list');

      if (addresses.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #999;">Đưa chỉ bưu gửi vẩn chưa có</p>';
        return;
      }

      container.innerHTML = addresses.map(addr => `
        <div class="address-card ${addr.isDefault ? 'default' : ''}">
          ${addr.isDefault ? '<span class="badge">Default</span>' : ''}
          <p>${addr.address}</p>
          <p>${addr.city}, ${addr.zip}</p>
          <p>${addr.country}</p>
          <div class="address-actions">
            <button onclick="editAddress('${addr.id}')" class="btn-secondary btn-sm">Sửa</button>
            <button onclick="deleteAddress('${addr.id}')" class="btn-danger btn-sm">Xóa</button>
          </div>
        </div>
      `).join('');
    }

    function openAddressModal() {
      document.getElementById('address-modal').style.display = 'flex';
    }

    function closeAddressModal() {
      document.getElementById('address-modal').style.display = 'none';
    }

    document.getElementById('address-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      try {
        setLoading(true, 'Đang thêm địa chỉ...');
        await userProfile.addAddress(
          document.getElementById('address-street').value,
          document.getElementById('address-city').value,
          document.getElementById('address-zip').value,
          document.getElementById('address-country').value,
          document.getElementById('address-default').checked
        );
        showToast('Đã thêm địa chỉ thành công', 'success');
        closeAddressModal();
        loadAddresses();
        document.getElementById('address-form').reset();
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        setLoading(false);
      }
    });

    async function deleteAddress(addressId) {
      if (!confirm('Xóa địa chỉ này?')) return;

      try {
        await userProfile.removeAddress(addressId);
        showToast('Đã xóa địa chỉ', 'success');
        loadAddresses();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    function showDeleteConfirm() {
      const password = prompt('Nhập mật khẩu để xác nhận xóa tài khoản:');
      if (password) {
        deleteAccount(password);
      }
    }

    async function deleteAccount(password) {
      try {
        setLoading(true, 'Deleting account...');
        await userProfile.deleteAccount(password);
        showToast('Account deleted', 'success');
        setTimeout(() => {
          window.location.href = '/';
        }, 1000);
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        setLoading(false);
      }
    }

    // Logout
    document.getElementById('logout-btn').addEventListener('click', () => {
      auth.logout();
      window.location.href = '/';
    });

    // Initialize
    loadProfileData();
  </script>
</body>
</html>
